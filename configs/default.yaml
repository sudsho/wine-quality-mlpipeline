# Defaults for the wine quality training run.
# Override on the command line via train.py --config <path>.

data:
  use: combined        # one of: red, white, combined
  threshold: 7         # quality >= threshold counts as a "good" wine
  test_size: 0.2
  random_state: 42

model:
  random_state: 42

# Grid that GridSearchCV walks. Keep small, this trains on a laptop.
param_grid:
  rf__n_estimators: [100, 200]
  rf__max_depth: [null, 10, 20]
  rf__min_samples_split: [2, 5]

cv:
  folds: 5
  scoring: f1
  n_jobs: -1

artifact:
  path: models/pipeline.joblib
